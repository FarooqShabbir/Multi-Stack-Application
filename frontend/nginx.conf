server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router / SPA fallback: any path that isn't a real static file
    # should serve index.html and let client-side routing handle it.
    # (We only have one route in this lab, but this is correct practice
    # for any React SPA served behind nginx.)
    location / {
        try_files $uri /index.html;
    }

    # Basic gzip for text assets -- reduces payload size to the browser.
    gzip on;
    gzip_types text/css application/javascript application/json;
}
