trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/*

pool:
  name: msa-lab-agent-pool

steps:
  - script: |
      echo "Triggering deploy on frontend instance via SSM..."
      aws ssm send-command \
        --instance-ids "$(FRONTEND_INSTANCE_ID)" \
        --document-name "AWS-RunShellScript" \
        --parameters commands='[
          "cd /home/ubuntu/Multi-Stack-Application || git clone https://github.com/FarooqShabbir/Multi-Stack-Application.git /home/ubuntu/Multi-Stack-Application",
          "cd /home/ubuntu/Multi-Stack-Application && git pull origin main",
          "cd /home/ubuntu/Multi-Stack-Application/frontend && sudo docker build -t msa-frontend .",
          "sudo docker rm -f frontend || true",
          "sudo docker run -d --name frontend --restart unless-stopped -p 3000:3000 msa-frontend"
        ]' \
        --region ap-southeast-1
    displayName: 'Deploy frontend via SSM'
